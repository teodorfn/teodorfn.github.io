<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparade pengar</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        .container {
            text-align: center;
            color: #ffffff;
        }

        .label {
            font-size: 2rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .ticker {
            font-size: 8rem;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .unit {
            font-size: 3rem;
            margin-left: 10px;
            opacity: 0.8;
        }

        .start-date {
            font-size: 1.5rem;
            margin-top: 20px;
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .ticker {
                font-size: 4rem;
            }

            .unit {
                font-size: 2rem;
            }

            .label {
                font-size: 1.5rem;
            }

            .start-date {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="label">Sparade pengar sedan jag slutade snusa</div>
        <div>
            <span class="ticker" id="savings">0</span>
            <span class="unit">SEK</span>
        </div>
        <div class="start-date">Sedan 20 juli 2025</div>
    </div>

    <script>
        const startDate = new Date('2025-07-20T00:00:00');

        const amountPerSecond = 0.00046;

        function updateTicker() {
            const now = new Date();
            const secondsElapsed = Math.floor((now - startDate) / 1000);

            const savedAmount = secondsElapsed * amountPerSecond;

            const formattedAmount = savedAmount.toLocaleString('sv-SE', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            document.getElementById('savings').textContent = formattedAmount;
        }

        updateTicker();
        setInterval(updateTicker, 1000);
    </script>
</body>

</html>
