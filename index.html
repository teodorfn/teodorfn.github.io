<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved since quitting snus</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            overflow-y: auto;
        }

        .container {
            text-align: center;
            color: #ffffff;
            padding: 40px 20px;
            width: 100%;
            max-width: 1200px;
        }

        .label {
            font-size: 2rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .ticker {
            font-size: 8rem;
            font-weight: bold;
            color: #4CAF50;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .unit {
            font-size: 3rem;
            margin-left: 10px;
            opacity: 0.8;
        }

        .start-date {
            font-size: 2rem;
            margin-top: 50px;
            opacity: 0.6;
        }

        .heart-rate {
            margin-top: 40px;
            font-size: 2.5rem;
            color: #ff4444;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .heart {
            font-size: 3rem;
            animation: heartbeat 1.2s ease-in-out infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .bpm-change {
            color: #4CAF50;
            font-weight: bold;
        }

        .heart-rate-detail {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 10px;
        }

        .heart-unit {
            opacity: 0.8;
            color: #ffffff;
        }

        .time-units {
            margin-top: 50px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .time-unit-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .time-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4CAF50;
            display: block;
        }

        .time-label {
            font-size: 1rem;
            opacity: 0.7;
            display: block;
            margin-top: 5px;
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .time-units {
                grid-template-columns: repeat(2, 1fr);
                max-width: 400px;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
            }

            .ticker {
                font-size: 2rem;
            }

            .unit {
                font-size: 1rem;
            }

            .label {
                font-size: 1.5rem;
            }

            .start-date {
                font-size: 1.2rem;
            }

            .heart-rate {
                font-size: 1.8rem;
            }

            .heart {
                font-size: 2rem;
            }

            .heart-rate-detail {
                font-size: rem;
            }

            .time-units {
                grid-template-columns: 1fr;
                gap: 10px;
                max-width: 300px;
                margin-left: auto;
                margin-right: auto;
            }

            .time-value {
                font-size: 1.2em;
            }

            .time-label {
                font-size: 0.9rem;
            }

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="label">Saved since July 20, 2025 (when I quit snus)</div>
        <div>
            <span class="ticker" id="savings">0</span>
            <span class="unit">SEK</span>
        </div>

        <div class="time-units">
            <div class="time-unit-item">
                <span class="time-value" id="days">0</span>
                <span class="time-label">days since start</span>
            </div>
            <div class="time-unit-item">
                <span class="time-value" id="months">0</span>
                <span class="time-label">months since start</span>
            </div>
            <div class="time-unit-item">
                <span class="time-value" id="snusWeight">0</span>
                <span class="time-label">kilograms of snus avoided</span>
            </div>
            <div class="time-unit-item">
                <span class="time-value" id="cansStack">0</span>
                <span class="time-label">meter tower of snus cans avoided</span>
            </div>
        </div>
    </div>

    <script>
        const startDate = new Date('2025-07-20T00:00:00');

        const amountPerSecond = 0.000336;

        function updateTicker() {
            const now = new Date();
            const secondsElapsed = Math.floor((now - startDate) / 1000);

            const savedAmount = secondsElapsed * amountPerSecond;

            const formattedAmount = savedAmount.toLocaleString('se-SV', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

            document.getElementById('savings').textContent = formattedAmount;

            const minutesElapsed = secondsElapsed / 60;

            const daysTotal = Math.floor(secondsElapsed / 86400);
            document.getElementById('days').textContent = daysTotal.toLocaleString('en-US');

            // Calculate months more accurately
            const monthsTotal = calculateMonthsDifference(startDate, now);
            document.getElementById('months').textContent = monthsTotal.toLocaleString('en-US');

            // Calculate snus weight and environmental impact
            // 1 can per day consumption rate
            const cansPerDay = 1;
            const totalCans = Math.floor(daysTotal * cansPerDay);

            // Calculate height of stacked cans
            // Standard snus can is about 2cm (20mm) tall
            const canHeightCm = 2;
            const totalHeightCm = totalCans * canHeightCm;
            const totalHeightMeters = totalHeightCm / 100;
            document.getElementById('cansStack').textContent = totalHeightMeters.toFixed(1);

            // Each can has 21 pouches at 0.8g each
            const pouchesPerCan = 21;
            const gramsPerPouch = 0.8;
            const gramsPerCan = pouchesPerCan * gramsPerPouch; // 16.8g
            const totalGrams = totalCans * gramsPerCan;
            const totalKg = totalGrams / 1000;
            document.getElementById('snusWeight').textContent = Math.round(totalKg).toLocaleString('en-US');
        }

        function calculateMonthsDifference(start, end) {
            let months = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth());
            // Adjust if we haven't reached the day of the month yet
            if (end.getDate() < start.getDate()) {
                months--;
            }
            return months;
        }

        updateTicker();
        setInterval(updateTicker, 1000);
    </script>
</body>

</html>
